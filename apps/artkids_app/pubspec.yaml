name: artkids_app
description: Ứng dụng khóa học vẽ online cho trẻ em — Parent Mode & Kid Mode
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  # State management — Riverpod: async AI polling, DI, testability
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # Networking
  dio: ^5.7.0
  retrofit: ^4.4.1
  json_annotation: ^4.9.0

  # Local storage (offline cache)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Environment config
  flutter_dotenv: ^5.2.1

  # Animation & 3D
  rive: ^0.13.20
  model_viewer_plus: ^1.9.1
  confetti: ^0.7.0

  # Audio
  just_audio: ^0.9.42

  # Push notifications
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6

  # Media & permissions
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  cached_network_image: ^3.4.1
  path_provider: ^2.1.5

  # Kid Mode — hướng dẫn bằng giọng nói
  flutter_tts: ^4.2.0

  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  equatable: ^2.0.7
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  retrofit_generator: ^9.1.5
  json_serializable: ^6.8.0
  riverpod_generator: ^2.6.3
  # hive_generator removed — project uses plain Hive boxes without TypeAdapter codegen

flutter:
  uses-material-design: true
  assets:
    - env/
    - assets/animations/
    - assets/images/
    - assets/images/matching_game/
    - assets/audio/
    - assets/models/
